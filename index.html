    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var storedFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return storedFetch || originalFetch;
            },
            set: function(val) {
              storedFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
